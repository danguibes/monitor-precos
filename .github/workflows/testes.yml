name: testes

# Só os testes offline, contra as fixtures. Nunca coleta real: as lojas não
# devem receber tráfego do Actions, e o perfil logado não sai desta máquina.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -v
