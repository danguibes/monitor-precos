name: Atualizar agora
description: Pede ao notebook uma rodada de todos os monitores, sem esperar o próximo logon.
title: "Atualizar agora"
labels: ["atualizar"]
body:
  - type: markdown
    attributes:
      value: |
        Ao enviar, o notebook (se estiver ligado) percebe em até 5 minutos, roda todos os
        monitores, publica a página e fecha esta issue com a hora da atualização.
        Só pedidos abertos pelo dono do repositório são atendidos.
  - type: input
    id: obs
    attributes:
      label: Observação
      description: Opcional. Nada daqui é lido pelo notebook.
    validations:
      required: false
