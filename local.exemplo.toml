# Copie para local.toml e preencha. local.toml fica fora do git: o que é
# pessoal mora só nesta máquina. Os logins (Mercado Livre, Vila das Frutas)
# ficam no perfil do navegador, em dados/perfil-navegador/, também fora do git.

cep = "00000-000"

# A publicação no GitHub Pages é barrada se qualquer um destes aparecer na
# página gerada (o CEP acima já entra sozinho). Ponha rua, número, bairro.
nao_publicar = ["Rua Exemplo", "ap 00"]

# Opcional, e recomendado: um token do GitHub que só alcança este repositório.
# Sem ele, o monitor (e o vigia, que fica ligado o tempo todo) usa o login geral
# do gh, que alcança todos os seus repositórios. Crie em
# github.com/settings/personal-access-tokens/new: "Only select repositories" com
# só o monitor-precos; permissões Contents e Issues em "Read and write".
# [github]
# token = "github_pat_..."

# Opcional: app do Mercado Livre (developers.mercadolivre.com.br/devcenter), só para
# ferramentas/sonda_api_meli.py por enquanto. O token do app vem com escopo de
# escrita na sua conta: guarde a chave como senha.
# [mercadolivre]
# client_id = "..."
# client_secret = "..."

# Opcional: entrega dos pedidos online à pousada do Augustinus (py monitor.py
# --compras-online). Papel só de INSERT, diferente do [augustinus]. Espelhe o host,
# a porta e o banco de lá; pelo pooler, o usuário leva o ponto e o ref do projeto.
# conta é um rótulo seu (nunca e-mail): diz de qual conta veio o pedido.
# [augustinus_pedidos]
# host = "..."
# porta = 5432
# banco = "postgres"
# usuario = "monitor_pedidos.<ref>"
# senha = "..."
# conta = "danilo"

# Opcional: só para ferramentas/sonda_oxylabs.py (teste da Oxylabs contra o gabarito do
# monitor). É a chave gerada na instância do Web API no painel, não o login do painel.
# [oxylabs]
# chave = "..."
