nome = "Detergente"
pasta = "mercado"
titulo = "Detergente líquido 500 ml · por litro"
modo = "descoberta"
intervalo_minimo_horas = 12
termos = ["detergente líquido 500ml", "lava louças líquido 500ml"]

[regras]
incluir = ['detergente|lava.?lou[çc]as']
excluir = ['\bp[óo]\b', 'roupa|m[áa]quina|tablete|pastilha|finish', 'automotiv|carro|multiuso|desengordurante|piso|limpador|sanit', '\bkit\b|\+']
volume_ml = [450, 550]
